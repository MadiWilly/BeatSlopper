# License gate for BeatSlopper (docs/PLAN.md): permissive licenses only, no GPL/LGPL/AGPL.
[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true
