<!doctype html>
<!--
  BeatSlopper design C — "HUSH CONSOLE" (Soft Mixer)
  A calm soft-touch mixing console: thin inset sliders with tiny accent thumbs are the hero,
  knobs only where rotation is natural, everything floating on one surface colour.

  ============================ THEME TOKENS (final) ============================
  DARK
    surface            #262A31
    shadow highlight   #31363E   (tuned up from #30353D: +1 step so raised edges read on charcoal)
    shadow dark        #171A1F   (tuned down from #1A1D22: 20px blur needed a touch more depth)
    accent             #FF7A1A
    accent hover       #FF9440
    accent glow        rgba(255,122,26,0.45)
    on-accent text     #141821
    text primary       #F2F2F2
    text secondary     #A8ADB5   (6.2:1 on surface)
    key black          #171A1F   / key black text #A8ADB5
    arc / track line   #171A1F

  LIGHT
    surface            #E8ECF3
    shadow highlight   #FFFFFF
    shadow dark        #C3CAD6
    accent             #1E5BFF   (4.5:1 on surface; white on it 5.3:1)
    accent hover       #2E6AFF   (white on it 4.5:1)
    accent glow        rgba(30,91,255,0.40)
    on-accent text     #FFFFFF
    text primary       #1C2130
    text secondary     #5E6675   (tuned from #6B7382 which was 4.1:1 -> fails AA; now 4.9:1)
    key black          #5E6675   / key black text #FFFFFF
    arc / track line   #C3CAD6

  SHADOWS (x y blur spread colour)         dark theme uses sh-hi / sh-lo above
    raised-lg (panels)        -8 -8 20 0 sh-hi   |   8  8 20 0 sh-lo
    raised-sm (controls)      -3 -3  8 0 sh-hi   |   3  3  8 0 sh-lo
    inset-sm  (tracks, seg)   inset -3 -3 8 0 sh-hi | inset 3 3 8 0 sh-lo
    inset-md  (pressed pill)  inset -4 -4 10 0 sh-hi | inset 4 4 10 0 sh-lo
    glow (ON state)           0 0 14 2 accent-glow  |  4 4 10 0 sh-lo
    thumb (slider thumb)      2 2 6 0 sh-lo
    playhead dot              0 0 8 1 accent-glow

  RADII      panel 20 | step cell 8 | piano key 10 | black key 8 | pill 999 | circle 50%
  SPACING    4 8 12 16 20 24 32
             page padding 20, panel gap 16, panel padding 16x22 (transport 14x26)
             group gap 32, group row gap 20, control gap 8, header-to-controls 12
  TYPE       system-ui geometric sans (weights 300/400/500 only)
             brand 16/300 tracking .04em (second word 500)
             label 11/500 uppercase tracking .12em (text secondary)
             value 11/400 tabular
             body / row name 13/400, seg item 11/400 tracking .06em (selected 11/500 text primary)
             bpm display 20/300, octave display 16/300, beat number 11/400
             piano: note name 11/400 secondary, computer key 13/500 (black keys 12/500)
  SIZES      knob face 44 circle (arc radius 25, stroke 2, sweep -135..+135, bipolar knobs sweep from 0;
                 pointer dot 4 at 6px from edge), knob column 56
             transport button 44 circle, stepper button 28 circle, clear-row button 28 circle
             pill button 32 tall, padding 0 18 | seg selector 30 tall, item padding 0 8
             bpm pill 72x36 inset-md | theme toggle 54x28 inset-sm, knob 22 raised-sm
             v-slider: track 6x66 inset-sm, fill 2 wide, thumb 14 circle, end dots 4, column 44
             h-slider: track 84x6 (96x6 in transport), thumb 14
             step cell 28x28 r8, gap 10, group gap 28, playhead dot 5 (header row 16 tall)
             row name column 110, row level slider column 190
             white key 58x96 r10 gap 6 | black key 34x56 r8 | piano 890 wide
             limiter LED 12 circle (inset-sm off, accent + glow on)
  ===============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatSlopper Hush Console</title>
<style>
:root{
  --surface:#262A31; --sh-hi:#31363E; --sh-lo:#171A1F;
  --accent:#FF7A1A; --accent-hover:#FF9440; --accent-glow:rgba(255,122,26,.45); --on-accent:#141821;
  --text:#F2F2F2; --text-2:#A8ADB5; --line:#171A1F;
  --key-black:#171A1F; --key-black-text:#A8ADB5;
  --r-panel:20px; --r-step:8px; --r-key:10px; --r-pill:999px;
  --raise-lg:-8px -8px 20px 0 var(--sh-hi), 8px 8px 20px 0 var(--sh-lo);
  --raise-sm:-3px -3px 8px 0 var(--sh-hi), 3px 3px 8px 0 var(--sh-lo);
  --inset-sm:inset -3px -3px 8px 0 var(--sh-hi), inset 3px 3px 8px 0 var(--sh-lo);
  --inset-md:inset -4px -4px 10px 0 var(--sh-hi), inset 4px 4px 10px 0 var(--sh-lo);
  --glow:0 0 14px 2px var(--accent-glow), 4px 4px 10px 0 var(--sh-lo);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --surface:#E8ECF3; --sh-hi:#FFFFFF; --sh-lo:#C3CAD6;
    --accent:#1E5BFF; --accent-hover:#2E6AFF; --accent-glow:rgba(30,91,255,.40); --on-accent:#FFFFFF;
    --text:#1C2130; --text-2:#5E6675; --line:#C3CAD6;
    --key-black:#5E6675; --key-black-text:#FFFFFF;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --surface:#E8ECF3; --sh-hi:#FFFFFF; --sh-lo:#C3CAD6;
  --accent:#1E5BFF; --accent-hover:#2E6AFF; --accent-glow:rgba(30,91,255,.40); --on-accent:#FFFFFF;
  --text:#1C2130; --text-2:#5E6675; --line:#C3CAD6;
  --key-black:#5E6675; --key-black-text:#FFFFFF;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--surface);color:var(--text)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:13px;font-weight:400;line-height:1.3;-webkit-font-smoothing:antialiased;
  padding:20px;overflow-x:hidden;
}
.app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px;user-select:none}
.panel{background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--raise-lg);padding:16px 22px}
.lbl{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}
.val{font-size:11px;font-weight:400;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
svg{display:block}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- transport ---------- */
.transport{display:flex;align-items:center;gap:32px;padding:14px 26px}
.brand{font-size:16px;font-weight:300;letter-spacing:.04em;margin-right:4px}
.brand b{font-weight:500}
.tgroup{display:flex;align-items:center;gap:14px}
.ib{width:44px;height:44px;border-radius:50%;box-shadow:var(--raise-sm);display:grid;place-items:center;color:var(--text-2);cursor:pointer}
.ib:hover{color:var(--text)}
.ib:active{box-shadow:var(--inset-sm)}
.ib.on{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow)}
.ib.on:hover{background:var(--accent-hover)}
.ib .rec{width:12px;height:12px;border-radius:50%;background:currentColor}
.stp{display:inline-flex;align-items:center;gap:12px}
.rb{width:28px;height:28px;border-radius:50%;box-shadow:var(--raise-sm);display:grid;place-items:center;color:var(--text-2);cursor:pointer}
.rb:hover{color:var(--text)}
.rb:active{box-shadow:var(--inset-sm)}
.rb .ico{width:14px;height:14px}
.disp{min-width:72px;height:36px;border-radius:var(--r-pill);box-shadow:var(--inset-md);display:grid;place-items:center;font-size:20px;font-weight:300;font-variant-numeric:tabular-nums;padding:0 14px}
.tctl{display:flex;align-items:center;gap:12px}
.spacer{flex:1}

/* theme toggle */
.tgl{width:54px;height:28px;border-radius:var(--r-pill);box-shadow:var(--inset-sm);position:relative;cursor:pointer}
.tgl .kn{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;box-shadow:var(--raise-sm);display:grid;place-items:center;color:var(--text-2);transition:left .18s}
.tgl .kn .ico{width:13px;height:13px}
.tgl .sun{display:none}
:root[data-theme="light"] .tgl .kn{left:29px}
:root[data-theme="light"] .tgl .sun{display:block}
:root[data-theme="light"] .tgl .moon{display:none}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]) .tgl .kn{left:29px}
  :root:not([data-theme="dark"]) .tgl .sun{display:block}
  :root:not([data-theme="dark"]) .tgl .moon{display:none}
}

/* ---------- layout ---------- */
.mid{display:flex;gap:16px}
.synth{flex:0 0 772px}
.fx{flex:1}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ptitle{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.grps{display:flex;gap:32px}
.grps + .grps{margin-top:20px}
.grp{display:flex;flex-direction:column;gap:12px}
.ghead{display:flex;align-items:center;gap:14px;min-height:30px}
.ctrls{display:flex;align-items:flex-end;gap:8px}

/* ---------- segmented ---------- */
.seg{display:inline-flex;align-items:center;height:30px;border-radius:var(--r-pill);box-shadow:var(--inset-sm);padding:0 6px}
.seg span{padding:0 8px;line-height:30px;font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg span:hover{color:var(--text)}
.seg span.on{color:var(--text);font-weight:500}

/* ---------- vertical slider ---------- */
.vs{display:flex;flex-direction:column;align-items:center;gap:4px;width:44px;touch-action:none}
.vs .dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
.vs .trk{position:relative;width:6px;height:66px;border-radius:var(--r-pill);box-shadow:var(--inset-sm);cursor:ns-resize}
.vs .fill{position:absolute;left:2px;right:2px;bottom:3px;border-radius:var(--r-pill);background:var(--accent)}
.vs .thumb{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);box-shadow:2px 2px 6px 0 var(--sh-lo);transform:translateY(50%)}
.vs:hover .thumb{background:var(--accent-hover)}
.vs .val{margin-top:2px}

/* ---------- horizontal slider ---------- */
.hs{display:flex;align-items:center;gap:10px;touch-action:none}
.hs .trk{position:relative;width:84px;height:6px;border-radius:var(--r-pill);box-shadow:var(--inset-sm);cursor:ew-resize;flex:none}
.hs.wide .trk{width:96px}
.hs .fill{position:absolute;top:2px;bottom:2px;left:3px;border-radius:var(--r-pill);background:var(--accent)}
.hs .thumb{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--accent);box-shadow:2px 2px 6px 0 var(--sh-lo);transform:translateX(-50%)}
.hs:hover .thumb{background:var(--accent-hover)}
.hs .val{min-width:34px}

/* ---------- knob ---------- */
.knob{display:flex;flex-direction:column;align-items:center;gap:6px;width:56px;touch-action:none}
.knob .face{position:relative;width:44px;height:44px;margin:6px;border-radius:50%;box-shadow:var(--raise-sm);cursor:ns-resize}
.knob .face:active{box-shadow:var(--inset-sm)}
.knob svg{position:absolute;left:-6px;top:-6px;width:56px;height:56px;overflow:visible}
.knob .arc-t{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round}
.knob .arc-v{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.knob .ptr{position:absolute;inset:0;border-radius:50%}
.knob .ptr::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}

/* ---------- pill buttons ---------- */
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 18px;border-radius:var(--r-pill);box-shadow:var(--raise-sm);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2);cursor:pointer}
.pill:hover{color:var(--text)}
.pill:active{box-shadow:var(--inset-md)}
.pill .ico{width:14px;height:14px}

/* limiter */
.lim{display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:38px}
.lim .led{width:12px;height:12px;border-radius:50%;box-shadow:var(--inset-sm)}
.lim .led.on{background:var(--accent);box-shadow:var(--glow)}

/* ---------- sequencer ---------- */
.seq .rows{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:14px;height:28px}
.srow .name{width:110px;font-size:13px;font-weight:400;color:var(--text)}
.srow .hs{width:190px}
.steps{display:flex;gap:10px}
.steps > *:nth-child(4n+1):not(:first-child){margin-left:28px}
.step{width:28px;height:28px;border-radius:var(--r-step);box-shadow:var(--raise-sm);display:grid;place-items:center;font-size:11px;font-weight:400;color:var(--text-2);cursor:pointer;font-variant-numeric:tabular-nums}
.step:hover{color:var(--text)}
.step.cur{box-shadow:var(--inset-sm)}
.step.on{background:var(--accent);color:var(--on-accent);box-shadow:var(--glow)}
.step.on.cur,.step.on.acc{background:var(--accent-hover)}
.step.acc::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--on-accent)}
.step.bass.acc::after{display:none}
.hdr{height:16px}
.hdr .beat{width:28px;height:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
.hdr .beat i{width:5px;height:5px;border-radius:50%}
.hdr .beat.cur i{background:var(--accent);box-shadow:0 0 8px 1px var(--accent-glow)}
.clr{width:28px;height:28px;border-radius:50%;box-shadow:var(--raise-sm);display:grid;place-items:center;color:var(--text-2);cursor:pointer;margin-left:10px}
.clr:hover{color:var(--text)}
.clr:active{box-shadow:var(--inset-sm)}
.clr .ico{width:12px;height:12px}

/* ---------- piano ---------- */
.pianorow{display:flex;align-items:center;gap:40px}
.piano{position:relative;width:890px;height:96px;flex:none}
.wk,.bk{position:absolute;top:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;touch-action:none}
.wk{width:58px;height:96px;border-radius:var(--r-key);box-shadow:var(--raise-sm);padding-bottom:10px;gap:3px}
.wk .note{font-size:11px;color:var(--text-2)}
.wk .kb{font-size:13px;font-weight:500;color:var(--text)}
.bk{width:34px;height:56px;border-radius:var(--r-step);background:var(--key-black);box-shadow:4px 4px 10px 0 var(--sh-lo);padding-bottom:8px;color:var(--key-black-text);font-size:12px;font-weight:500;z-index:2}
.wk.down,.bk.down{background:var(--accent);box-shadow:var(--glow)}
.wk.down .note,.wk.down .kb,.bk.down{color:var(--on-accent)}
.oct{display:flex;flex-direction:column;gap:14px;align-items:center}
.oct .stp .disp{font-size:16px;min-width:84px;letter-spacing:.06em}
.oct .rb{font-size:12px;font-weight:500}
</style>
</head>
<body>
<div class="app">

  <!-- ================= TRANSPORT ================= -->
  <header class="panel transport">
    <div class="brand">Beat<b>Slopper</b></div>

    <div class="tgroup">
      <div class="ib" id="play" title="Play (space)">
        <svg class="ico" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>
      </div>
      <div class="ib" id="stop" title="Stop">
        <svg class="ico" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
      </div>
      <div class="ib" id="rec" title="Record arm"><span class="rec"></span></div>
    </div>

    <div class="tctl">
      <div class="lbl">BPM</div>
      <div class="stp">
        <div class="rb" data-step="-1"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></div>
        <div class="disp" id="bpm">120</div>
        <div class="rb" data-step="1"><svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></div>
      </div>
    </div>

    <div class="tctl">
      <div class="lbl">Swing</div>
      <div class="hs wide" data-name="Swing" data-val="0.54" data-fmt="pct"></div>
    </div>

    <div class="tctl">
      <div class="lbl">Master</div>
      <div class="hs wide" data-name="Master" data-val="0.8" data-fmt="db"></div>
    </div>

    <div class="spacer"></div>

    <div class="tgl" id="theme" title="Toggle theme">
      <div class="kn">
        <svg class="ico moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="ico sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      </div>
    </div>
  </header>

  <div class="mid">
    <!-- ================= SYNTH ================= -->
    <section class="panel synth">
      <div class="phead">
        <div class="ptitle">Synth</div>
        <div class="seg" data-opts="Bass,Lead,Pad,Pluck" data-sel="0"></div>
      </div>

      <div class="grps">
        <div class="grp">
          <div class="ghead"><div class="lbl">Osc 1</div><div class="seg" data-opts="Sine,Saw,Square,Tri" data-sel="1"></div></div>
          <div class="ctrls">
            <div class="knob" data-name="Detune" data-min="-50" data-max="50" data-val="-7" data-fmt="ct"></div>
            <div class="vs" data-name="Mix" data-val="0.8" data-fmt="pct"></div>
          </div>
        </div>

        <div class="grp">
          <div class="ghead"><div class="lbl">Osc 2</div><div class="seg" data-opts="Sine,Saw,Square,Tri" data-sel="2"></div></div>
          <div class="ctrls">
            <div class="knob" data-name="Detune" data-min="-50" data-max="50" data-val="12" data-fmt="ct"></div>
            <div class="vs" data-name="Mix" data-val="0.45" data-fmt="pct"></div>
          </div>
        </div>

        <div class="grp">
          <div class="ghead"><div class="lbl">Filter</div></div>
          <div class="ctrls">
            <div class="knob" data-name="Cutoff" data-min="20" data-max="20000" data-val="2400" data-fmt="hz" data-log="1"></div>
            <div class="knob" data-name="Reso" data-min="0" data-max="1" data-val="0.3" data-fmt="pct"></div>
            <div class="vs" data-name="Env" data-val="0.62" data-fmt="pct"></div>
          </div>
        </div>
      </div>

      <div class="grps">
        <div class="grp">
          <div class="ghead"><div class="lbl">Amp envelope</div></div>
          <div class="ctrls">
            <div class="vs" data-name="A" data-val="0.12" data-fmt="pct"></div>
            <div class="vs" data-name="D" data-val="0.4" data-fmt="pct"></div>
            <div class="vs" data-name="S" data-val="0.7" data-fmt="pct"></div>
            <div class="vs" data-name="R" data-val="0.33" data-fmt="pct"></div>
          </div>
        </div>

        <div class="grp">
          <div class="ghead"><div class="lbl">LFO</div><div class="seg" data-opts="Pitch,Cutoff" data-sel="1"></div><div class="lbl">Target</div></div>
          <div class="ctrls">
            <div class="knob" data-name="Rate" data-min="0.1" data-max="20" data-val="4.2" data-fmt="hzf" data-log="1"></div>
            <div class="vs" data-name="Depth" data-val="0.25" data-fmt="pct"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= FX ================= -->
    <section class="panel fx">
      <div class="phead"><div class="ptitle">Effects</div></div>

      <div class="grps">
        <div class="grp">
          <div class="ghead"><div class="lbl">Drive</div></div>
          <div class="ctrls">
            <div class="vs" data-name="Amt" data-val="0.35" data-fmt="pct"></div>
            <div class="vs" data-name="Mix" data-val="0.5" data-fmt="pct"></div>
          </div>
        </div>

        <div class="grp">
          <div class="ghead"><div class="lbl">Delay</div><div class="seg" data-opts="1/16,1/8,1/4,1/2" data-sel="1"></div></div>
          <div class="ctrls">
            <div class="vs" data-name="Fdbk" data-val="0.42" data-fmt="pct"></div>
            <div class="vs" data-name="Mix" data-val="0.22" data-fmt="pct"></div>
          </div>
        </div>
      </div>

      <div class="grps">
        <div class="grp">
          <div class="ghead"><div class="lbl">Reverb</div></div>
          <div class="ctrls">
            <div class="vs" data-name="Size" data-val="0.6" data-fmt="pct"></div>
            <div class="vs" data-name="Damp" data-val="0.48" data-fmt="pct"></div>
            <div class="vs" data-name="Mix" data-val="0.18" data-fmt="pct"></div>
          </div>
        </div>

        <div class="grp">
          <div class="ghead"><div class="lbl">Master</div></div>
          <div class="ctrls">
            <div class="vs" id="gain" data-name="Gain" data-val="0.78" data-fmt="db"></div>
            <div class="lim">
              <div class="led" id="led"></div>
              <div class="lbl">Limit</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- ================= SEQUENCER ================= -->
  <section class="panel seq">
    <div class="phead">
      <div class="ptitle">Sequencer</div>
      <div class="pill" id="clearall">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>Clear all
      </div>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <!-- ================= PIANO ================= -->
  <section class="panel">
    <div class="phead"><div class="ptitle">Keys</div></div>
    <div class="pianorow">
      <div class="piano" id="piano"></div>
      <div class="oct">
        <div class="stp">
          <div class="rb" data-oct="-1">Z</div>
          <div class="disp" id="octd">OCT 3</div>
          <div class="rb" data-oct="1">X</div>
        </div>
        <div class="lbl">Octave</div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
  'use strict';
  const $ = (s, el=document) => el.querySelector(s);
  const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
  const clamp = (v,a,b) => Math.min(b, Math.max(a, v));

  /* ---------- theme ---------- */
  const root = document.documentElement;
  let stored = null;
  try { stored = localStorage.getItem('bs-theme'); } catch(e){}
  if (stored === 'light' || stored === 'dark') root.dataset.theme = stored;
  function currentTheme(){
    if (root.dataset.theme) return root.dataset.theme;
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  $('#theme').addEventListener('click', () => {
    const next = currentTheme() === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    try { localStorage.setItem('bs-theme', next); } catch(e){}
  });

  /* ---------- value formatting ---------- */
  const fmt = {
    pct: v => Math.round(v*100) + '%',
    db:  v => (v <= 0 ? '-inf' : (20*Math.log10(v)).toFixed(1) + ' dB'),
    ct:  v => (v > 0 ? '+' : '') + Math.round(v) + ' c',
    st:  v => (v > 0 ? '+' : '') + Math.round(v) + ' st',
    hz:  v => v >= 1000 ? (v/1000).toFixed(1) + ' kHz' : Math.round(v) + ' Hz',
    hzf: v => v.toFixed(1) + ' Hz',
  };

  /* ---------- segmented ---------- */
  $$('.seg').forEach(seg => {
    const opts = seg.dataset.opts.split(',');
    let sel = +seg.dataset.sel || 0;
    opts.forEach((o,i) => {
      const s = document.createElement('span');
      s.textContent = o;
      if (i === sel) s.classList.add('on');
      s.addEventListener('click', () => {
        $$('span', seg).forEach(x => x.classList.remove('on'));
        s.classList.add('on');
        seg.dataset.sel = i;
      });
      seg.appendChild(s);
    });
  });

  /* ---------- sliders (vertical + horizontal) ---------- */
  function buildSlider(el){
    const vertical = el.classList.contains('vs');
    const min = +(el.dataset.min ?? 0), max = +(el.dataset.max ?? 1);
    const def = +el.dataset.val;
    const f = fmt[el.dataset.fmt] || (v => v.toFixed(2));
    let val = def;

    const trk = document.createElement('div'); trk.className = 'trk';
    const fill = document.createElement('div'); fill.className = 'fill';
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    trk.append(fill, thumb);
    const valEl = document.createElement('div'); valEl.className = 'val';

    if (vertical){
      const d1 = document.createElement('i'); d1.className = 'dot';
      const d2 = document.createElement('i'); d2.className = 'dot';
      const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = el.dataset.name;
      el.append(d1, trk, d2, valEl, lbl);
    } else {
      el.append(trk, valEl);
    }

    function render(){
      const n = (val - min) / (max - min);
      if (vertical){
        fill.style.height = `calc(${(n*100).toFixed(2)}% - 3px)`;
        thumb.style.bottom = (n*100).toFixed(2) + '%';
      } else {
        fill.style.width = `calc(${(n*100).toFixed(2)}% - 3px)`;
        thumb.style.left = (n*100).toFixed(2) + '%';
      }
      valEl.textContent = f(val);
      el.dataset.val = val;
      el.dispatchEvent(new CustomEvent('change', { detail: val }));
    }
    function fromPointer(e){
      const r = trk.getBoundingClientRect();
      const n = vertical ? 1 - (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
      val = min + clamp(n,0,1) * (max - min);
      render();
    }
    trk.addEventListener('pointerdown', e => {
      trk.setPointerCapture(e.pointerId);
      fromPointer(e);
      const mv = ev => fromPointer(ev);
      const up = () => { trk.removeEventListener('pointermove', mv); trk.removeEventListener('pointerup', up); };
      trk.addEventListener('pointermove', mv);
      trk.addEventListener('pointerup', up);
    });
    trk.addEventListener('dblclick', () => { val = def; render(); });
    el.setValue = v => { val = clamp(v, min, max); render(); };
    render();
  }
  $$('.vs, .hs').forEach(buildSlider);

  /* ---------- knobs ---------- */
  const SVG = 'http://www.w3.org/2000/svg';
  function pt(cx,cy,r,a){ const t = (a-90)*Math.PI/180; return [cx + r*Math.cos(t), cy + r*Math.sin(t)]; }
  function arc(cx,cy,r,a0,a1){
    const [x0,y0] = pt(cx,cy,r,a0), [x1,y1] = pt(cx,cy,r,a1);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${(a1-a0) > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  }
  function buildKnob(el){
    const min = +el.dataset.min, max = +el.dataset.max, def = +el.dataset.val;
    const log = el.dataset.log === '1', bipolar = min < 0 && max > 0;
    const f = fmt[el.dataset.fmt] || (v => v.toFixed(2));
    const toN = v => log ? Math.log(v/min)/Math.log(max/min) : (v-min)/(max-min);
    const fromN = n => log ? min*Math.pow(max/min, n) : min + n*(max-min);
    let n = toN(def);

    const face = document.createElement('div'); face.className = 'face';
    const svg = document.createElementNS(SVG,'svg'); svg.setAttribute('viewBox','0 0 56 56');
    const t = document.createElementNS(SVG,'path'); t.setAttribute('class','arc-t'); t.setAttribute('d', arc(28,28,25,-135,135));
    const v = document.createElementNS(SVG,'path'); v.setAttribute('class','arc-v');
    svg.append(t, v);
    const ptr = document.createElement('div'); ptr.className = 'ptr';
    face.append(svg, ptr);
    const valEl = document.createElement('div'); valEl.className = 'val';
    const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = el.dataset.name;
    el.append(face, valEl, lbl);

    function render(){
      const a = -135 + n*270;
      ptr.style.transform = `rotate(${a}deg)`;
      const a0 = bipolar ? 0 : -135;   // bipolar knobs sweep out from the top centre
      v.setAttribute('d', Math.abs(a - a0) > 0.5 ? arc(28,28,25,Math.min(a0,a),Math.max(a0,a)) : '');
      valEl.textContent = f(fromN(n));
    }
    face.addEventListener('pointerdown', e => {
      face.setPointerCapture(e.pointerId);
      const y0 = e.clientY, n0 = n;
      const mv = ev => { n = clamp(n0 + (y0 - ev.clientY) / (ev.shiftKey ? 600 : 150), 0, 1); render(); };
      const up = () => { face.removeEventListener('pointermove', mv); face.removeEventListener('pointerup', up); };
      face.addEventListener('pointermove', mv);
      face.addEventListener('pointerup', up);
    });
    face.addEventListener('dblclick', () => { n = toN(def); render(); });
    render();
  }
  $$('.knob').forEach(buildKnob);

  /* ---------- limiter LED follows master gain ---------- */
  const gain = $('#gain'), led = $('#led');
  const updLed = () => led.classList.toggle('on', +gain.dataset.val > 0.85);
  gain.addEventListener('change', updLed); updLed();

  /* ---------- BPM stepper ---------- */
  let bpm = 120;
  const bpmEl = $('#bpm');
  $$('.rb[data-step]').forEach(b => b.addEventListener('click', () => {
    bpm = clamp(bpm + (+b.dataset.step), 40, 240);
    bpmEl.textContent = bpm;
    if (playing) startClock();
  }));

  /* ---------- sequencer ---------- */
  const NOTES = ['C2','D2','D#2','F2','G2','G#2','A#2','C3'];
  const rowsDef = [
    { name:'Kick',       pat:'1000100010001000', acc:'1000000010000000' },
    { name:'Snare',      pat:'0000100000001000', acc:'' },
    { name:'Clap',       pat:'0000100000001001', acc:'' },
    { name:'Closed Hat', pat:'1010101010101010', acc:'' },
    { name:'Open Hat',   pat:'0000001000000010', acc:'' },
    { name:'Bass',       pat:'1001001010010010', bass:true, notes:'0003003400030050' },
  ];
  const rowsEl = $('#rows');
  const cells = []; // cells[row][col]

  // header: beat numbers + playhead dots
  const hdr = document.createElement('div'); hdr.className = 'srow hdr';
  hdr.innerHTML = '<div class="name"></div><div style="width:190px"></div>';
  const hsteps = document.createElement('div'); hsteps.className = 'steps';
  const beats = [];
  for (let c = 0; c < 16; c++){
    const b = document.createElement('div'); b.className = 'beat';
    b.innerHTML = (c % 4 === 0 ? `<span>${c/4 + 1}</span>` : '<span></span>') + '<i></i>';
    hsteps.appendChild(b); beats.push(b);
  }
  hdr.appendChild(hsteps);
  rowsEl.appendChild(hdr);

  rowsDef.forEach((rd, ri) => {
    const row = document.createElement('div'); row.className = 'srow';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = rd.name;
    const ctl = document.createElement('div'); ctl.className = 'hs';
    if (rd.bass){ ctl.dataset.min = -12; ctl.dataset.max = 12; ctl.dataset.val = 0; ctl.dataset.fmt = 'st'; }
    else { ctl.dataset.val = (0.7 + ri*0.05).toFixed(2); ctl.dataset.fmt = 'pct'; }
    const steps = document.createElement('div'); steps.className = 'steps';
    cells[ri] = [];
    for (let c = 0; c < 16; c++){
      const s = document.createElement('div'); s.className = 'step' + (rd.bass ? ' bass' : '');
      s.dataset.on = rd.pat[c];
      if (rd.bass){ s.dataset.note = rd.notes[c]; }
      else if (rd.acc && rd.acc[c] === '1') s.classList.add('acc');
      s.addEventListener('click', e => {
        if (e.shiftKey){
          if (rd.bass){
            s.dataset.on = '1';
            s.dataset.note = ((+s.dataset.note) + 1) % NOTES.length;
          } else if (s.dataset.on === '1') s.classList.toggle('acc');
        } else {
          s.dataset.on = s.dataset.on === '1' ? '0' : '1';
          if (s.dataset.on === '0') s.classList.remove('acc');
        }
        paint(s);
      });
      steps.appendChild(s); cells[ri].push(s);
      paint(s);
    }
    const clr = document.createElement('div'); clr.className = 'clr'; clr.title = 'Clear row';
    clr.innerHTML = '<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    clr.addEventListener('click', () => cells[ri].forEach(s => { s.dataset.on = '0'; s.classList.remove('acc'); paint(s); }));
    row.append(name, ctl, steps, clr);
    rowsEl.appendChild(row);
    buildSlider(ctl);
  });
  function paint(s){
    const on = s.dataset.on === '1';
    s.classList.toggle('on', on);
    if (s.classList.contains('bass')) s.textContent = on ? NOTES[+s.dataset.note] : '–';
  }
  $('#clearall').addEventListener('click', () => cells.flat().forEach(s => { s.dataset.on = '0'; s.classList.remove('acc'); paint(s); }));

  /* ---------- transport / playhead ---------- */
  let playing = false, col = -1, timer = null;
  const playBtn = $('#play');
  function setCol(c){
    if (col >= 0){ beats[col].classList.remove('cur'); cells.forEach(r => r[col].classList.remove('cur')); }
    col = c;
    if (col >= 0){ beats[col].classList.add('cur'); cells.forEach(r => r[col].classList.add('cur')); }
  }
  function startClock(){
    clearInterval(timer);
    timer = setInterval(() => setCol((col + 1) % 16), 60000 / bpm / 4);
  }
  function play(){
    playing = true; playBtn.classList.add('on');
    if (col < 0) setCol(0);
    startClock();
  }
  function stop(){
    playing = false; playBtn.classList.remove('on');
    clearInterval(timer); timer = null; setCol(-1);
  }
  playBtn.addEventListener('click', () => playing ? (clearInterval(timer), playing = false, playBtn.classList.remove('on')) : play());
  $('#stop').addEventListener('click', stop);
  $('#rec').addEventListener('click', e => e.currentTarget.classList.toggle('on'));

  /* ---------- piano ---------- */
  const WHITE = ['C','D','E','F','G','A','B'];
  const BLACK = { C:'C#', D:'D#', F:'F#', G:'G#', A:'A#' };
  const KEYMAP = ['a','w','s','e','d','f','t','g','y','h','u','j','k','o','l','p',';']; // chromatic from C
  const piano = $('#piano');
  const keyEls = {}; // semitone index (0..23) -> element
  let octave = 3;
  const KW = 58, GAP = 6;
  for (let o = 0; o < 2; o++){
    WHITE.forEach((wn, wi) => {
      const idx = o*7 + wi;
      const semi = o*12 + [0,2,4,5,7,9,11][wi];
      const k = document.createElement('div'); k.className = 'wk'; k.style.left = idx*(KW+GAP) + 'px';
      const note = document.createElement('span'); note.className = 'note';
      const kb = document.createElement('span'); kb.className = 'kb'; kb.textContent = (KEYMAP[semi] || '').toUpperCase();
      k.append(note, kb); k.dataset.semi = semi;
      piano.appendChild(k); keyEls[semi] = k;
      if (BLACK[wn]){
        const bsemi = semi + 1;
        const b = document.createElement('div'); b.className = 'bk';
        b.style.left = (idx*(KW+GAP) + KW + GAP/2 - 17) + 'px';
        b.textContent = (KEYMAP[bsemi] || '').toUpperCase(); b.dataset.semi = bsemi;
        piano.appendChild(b); keyEls[bsemi] = b;
      }
    });
  }
  function labelKeys(){
    Object.values(keyEls).forEach(k => {
      const semi = +k.dataset.semi, o = octave + Math.floor(semi/12), n = semi % 12;
      const name = [0,2,4,5,7,9,11].includes(n) ? WHITE[[0,2,4,5,7,9,11].indexOf(n)] : null;
      if (k.classList.contains('wk')) k.querySelector('.note').textContent = name + o;
    });
    $('#octd').textContent = 'OCT ' + octave;
  }
  labelKeys();
  Object.values(keyEls).forEach(k => {
    k.addEventListener('pointerdown', e => { k.classList.add('down'); k.setPointerCapture(e.pointerId); });
    k.addEventListener('pointerup', () => k.classList.remove('down'));
    k.addEventListener('pointercancel', () => k.classList.remove('down'));
  });
  function shiftOct(d){ octave = clamp(octave + d, 0, 7); labelKeys(); }
  $$('.rb[data-oct]').forEach(b => b.addEventListener('click', () => shiftOct(+b.dataset.oct)));

  const held = new Set();
  window.addEventListener('keydown', e => {
    if (e.repeat || e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === ' '){ e.preventDefault(); playing ? playBtn.click() : play(); return; }
    if (k === 'z'){ shiftOct(-1); return; }
    if (k === 'x'){ shiftOct(1); return; }
    const semi = KEYMAP.indexOf(k);
    if (semi >= 0 && keyEls[semi]){ keyEls[semi].classList.add('down'); held.add(semi); }
  });
  window.addEventListener('keyup', e => {
    const semi = KEYMAP.indexOf(e.key.toLowerCase());
    if (semi >= 0 && keyEls[semi]){ keyEls[semi].classList.remove('down'); held.delete(semi); }
  });
  window.addEventListener('blur', () => { held.forEach(s => keyEls[s].classList.remove('down')); held.clear(); });
})();
</script>
</body>
</html>
