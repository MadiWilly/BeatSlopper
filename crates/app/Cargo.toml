[package]
name = "app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true
description = "BeatSlopper desktop app: eframe UI, cpal audio output, keyboard input."

# The crate is a library (so `tests/` and the UI tests can drive the app state without a
# window) plus the `beatslopper` binary that wires it to eframe.
[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "beatslopper"
path = "src/main.rs"

[dependencies]
engine.workspace = true
neu.workspace = true
egui.workspace = true
eframe.workspace = true
cpal.workspace = true
serde.workspace = true
rfd.workspace = true
midir.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
